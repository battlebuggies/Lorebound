name: Java CI with Maven
on:
  workflow_dispatch:
  workflow_call:

  push:
    branches: [ "main", "dev-branch" ]
  pull_request:
    branches: [ "main", "dev-branch" ]

jobs:
  run-ci-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: maven
      - name: Build and Test with Maven
        run: mvn test -Dspring.profiles.active=default
